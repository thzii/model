[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "planora-sf-research"
version = "0.1.0"
description = "PLANORA-SF research scaffold: SelEx + FourEx mechanics for fine-grained GCD (no training loop yet)"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16", "Pillow>=9.0", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planora_sf = ["data/splits/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
