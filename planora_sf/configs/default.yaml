# PLANORA-SF default configuration (mirrors planora_sf.config.PlanoraSFConfig()).
# Provenance tags refer to PLANORA_SF_Method_Spec.md. U-xx values are scaffold
# defaults (engineering placeholders), not paper values.

selex_compat: true            # spec §8: reproduce official SelEx code behaviour
base: selex                   # FX-A §8: selex (FourEx) | gcd (FourGCD)
dataset: null

backbone:
  name: dinov1_vitb16         # FX-P §5.1 | dinov2_vitb14_reg | tiny (synthetic tests)
  grad_from_block: 9          # FX-P §5.1: train blocks 9-11
  train_final_norm: false     # SelEx ct.py:746-758
  image_size: 224             # ct.py:738

head:                         # SelEx DINOHead
  hidden_dim: 2048
  bottleneck_dim: 256
  num_layers: 3

latent:
  dim: 65536                  # D, ct.py:741 (U-12)
  fraction_of_half: true      # U-13
  high_fraction_mode: one_minus   # U-11: d_h = (1 - f_h/T_h) * D/2 | ratio
  renormalize_slices: false   # U-14

fourier:
  snr_target_db: 15.0         # FX-P §4
  cutoff: null                # T: calibrate (fourier.snr) or use for_dataset() (FX-A Table 7)
  cutoff_high: null           # null -> T_h = T_l (U-08)
  blur_kernel_size: 5         # FX-P §5.1
  blur_sigma: 1.1             # U-03
  blur_anchor: false          # U-03
  strict_inequality: true     # U-06
  band_pass: false            # U-07
  per_image_cutoffs: true     # U-02
  low_cutoff_min: 1           # U-02: f_l in {1..T_l}
  high_cutoff_min: 0          # U-02: f_h in {0..T_h-1}
  filtered_view: x1           # U-01
  extra_views: true           # U-01
  snr_metric: box             # U-09

selex:
  lam: 0.35                   # SX-P §5.1
  smoothing_alpha: 0.5        # SX-P §5.1; README values via for_dataset() (U-24)
  tau_unsup: 1.0              # ct.py:668
  tau_sup: 0.07               # ct.py:59
  similarity: neg_euclidean   # D-06
  use_loss: soft_ce           # D-01 | bce
  target_mode: null           # null -> compat if selex_compat else paper (U-21)
  balanced: true              # U-30
  kmeans_max_iter: 10         # ct.py:540-543
  kmeans_n_init: 1
  reproduce_label_order_bug: false   # U-22 / D-08

weights:                      # FX-P Table 5
  low: 0.1
  high: 0.1
  cls: 0.1

cls_head:                     # U-17 (unspecified in FourEx)
  enabled: true
  input: cls
  loss: sigmoid_bce
  num_classes: null           # null -> number of known classes

debgcd:                       # DebGCD (arXiv 2504.04804), adapted port (plan §2.2); docs/debgcd_port.md
  enabled: false              # E2/E3 toggle
  lam_sdl: 0.01               # §5.1 (upstream CUB script: 0.005)
  lam_adl: 1.0                # §5.1 (upstream CUB script: 4.0 x 0.5/0.5)
  threshold: 0.85             # tau, Eq. 11 (upstream CUB script: 0.65)
  tau_a: 0.1                  # Eq. 8
  tau_ova: 0.1                # upstream train_DebGCD.py:133
  tau_p: 0.1                  # DG-01 (centroid posterior, composed)
  detector_layers: 5          # App. K
  detector_hidden_dim: 2048
  detector_bottleneck_dim: 256
  consistency_filter: true    # Eq. 9; upstream code omits it (DG-11)
  align_clusters: true        # C2

hypcd:                        # HypCD (arXiv 2504.06120), Hyp-SelEx; upstream values are H-xx (plan §2)
  enabled: false              # E4 toggle
  curvature: 0.05             # c, paper (upstream script: 0.1)
  clip_r: 2.3                 # r, paper (upstream script: 2.0)
  alpha_max: 1.0              # alpha_d max, fine-grained
  alpha_epoch_offset: 0       # paper 0 | upstream 1 (H-06)
  angle_similarity: cosine    # paper | neg_euclidean (upstream Hyp-SelEx, H-01)
  project_eps: 1.0e-3         # upstream safety projection

optim:                        # SelEx code (U-23)
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-5
  epochs: 200
  eta_min_factor: 1.0e-3
  batch_size: 128

eval:
  clustering: bssk            # U-26: bssk | ss_kmeans
  n_init: 10                  # k_means.py:123
  max_iter: 10                # k_means.py:122
  metric: v2
  seed: 0                     # evaluation RNG seed (plan T1, A10)

data:                         # GCD split protocol (SX-P §5.1)
  known_class_fraction: 0.5
  labelled_fraction: 0.5
  split_seed: 0               # SelEx subsample_instances: np.random.seed(0)
  stratified: false           # SelEx samples globally over known-class images
  use_ssb_splits: true        # CUB/Aircraft/Cars SSB class lists

loop:
  num_workers: 4
  prototype_features: train_view0   # D-11 parity | test_transform
  eval_every: 0               # 0 = evaluate only after the last epoch
  max_steps_per_epoch: null   # dry runs only
  crop_pct: 0.875             # ct.py:712
  keep_checkpoint_every: 0    # also save epoch_XXX.pt every n epochs; 0 = off
  diagnostics: false          # per-epoch PL-acc L0 + routing (master plan Task #2b)
  grad_monitor_every: 0       # per-loss gradient cosines every n steps (Task #5); 0 = off
